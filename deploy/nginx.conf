server {
    listen 80;
    server_name lector.sidali.dev lector.dockerbop.fr;

    # Hide Nginx version
    server_tokens off;

    # Derrière Traefik (https) : redirections relatives, jamais vers http://.
    absolute_redirect off;

    # No access log: the reverse proxy already keeps one (docs/legal/REGISTRE.md,
    # line 1). The stock format would record X-Forwarded-For, so the visitor's IP.
    access_log off;

    # L'app est le site : lector.sidali.dev/ ouvre l'éditeur. Pas de page d'accueil.
    root /data/webapp;
    index index.html;

    location = / {
        try_files /index.html =404;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache" always;
    }

    # Service worker : toujours relu, pour qu'un déploiement soit pris au
    # rechargement suivant (le navigateur compare son contenu octet par octet).
    location = /sw.js {
        try_files /sw.js =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri =404;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Ancienne adresse de l'app : /app/ → / (le fragment #… suit tout seul).
    location /app/ {
        return 301 /$is_args$args;
    }

    # Pages liées depuis l'app : confidentialité et explication de la synchro.
    location = /privacy {
        root /usr/share/nginx/html;
        try_files /privacy.html =404;
    }
    location /sync/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/index.html =404;
    }
    location /fonts/ {
        root /usr/share/nginx/html;
    }

    # DMG download with Content-Disposition: attachment
    location /download/ {
        alias /data/releases/;
        add_header Content-Disposition "attachment";
        add_header Cache-Control "no-cache";
    }

    # Electron-updater metadata (CORS for auto-update)
    location /releases/ {
        alias /data/releases/;
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "no-cache";
    }

    # iOS OTA update API (latest-ios.json + zip bundle)
    location /api/ {
        alias /data/releases/;
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "no-cache, no-store";
    }

    # Document partagé (co-écriture) : /d/<id>#<clé> sert l'app web, qui ne
    # charge que la page du document. La clé est dans le fragment : elle
    # n'arrive jamais ici. Les fichiers relatifs (/d/assets/...) viennent de l'app.
    location ~ ^/d/(assets/.+|[^/]+\.(svg|png|webmanifest))$ {
        alias /data/webapp/$1;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ~ "^/d/[0-9a-f]{32}$" {
        root /data/webapp;
        try_files /index.html =404;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-cache" always;
    }

    # Ancien mode formation retiré : ses fichiers restés sur le serveur ne sont plus servis.
    location /formation/ {
        return 404;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # Fichiers de l'app nommés par leur contenu : gardés longtemps.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
