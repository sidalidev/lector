server {
    listen 80;
    server_name lector.dockerbop.fr;

    # Hide Nginx version
    server_tokens off;

    # No access log: the reverse proxy already keeps one (docs/legal/REGISTRE.md,
    # line 1). The stock format would record X-Forwarded-For, so the visitor's IP.
    access_log off;

    # Landing page
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Privacy policy (static HTML)
    location = /privacy {
        try_files /privacy.html =404;
    }

    # DMG download with Content-Disposition: attachment
    location /download/ {
        alias /data/releases/;
        add_header Content-Disposition "attachment";
        add_header Cache-Control "no-cache";
    }

    # Electron-updater metadata (CORS for auto-update)
    location /releases/ {
        alias /data/releases/;
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "no-cache";
    }

    # iOS OTA update API (latest-ios.json + zip bundle)
    location /api/ {
        alias /data/releases/;
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "no-cache, no-store";
    }

    # Lector web app (hosted mode pour formations)
    location /app/ {
        alias /data/webapp/;
        index index.html;
        try_files $uri $uri/ /app/index.html;
        # Jamais dans le cadre d'un autre site (frame-ancestors ne passe pas
        # par la balise meta de la CSP de l'app, docs/SECURITE.md).
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Document partagé (co-écriture) : /d/<id>#<clé> sert l'app web, qui ne
    # charge que la page du document. La clé est dans le fragment : elle
    # n'arrive jamais ici. Les fichiers relatifs (/d/assets/...) viennent de l'app.
    location ~ ^/d/(assets/.+|[^/]+\.(svg|png|webmanifest))$ {
        alias /data/webapp/$1;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ~ ^/d/[0-9a-f]{32}$ {
        root /data/webapp;
        try_files /index.html =404;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-cache" always;
    }

    # Formation hosted files (served from webapp)
    location /formation/ {
        alias /data/webapp/formation/;
        add_header Access-Control-Allow-Origin "*";
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # Cache static assets (hors /formation/ et /app/ qui ont leur propre location)
    location ~* ^(?!/formation/)(?!/app/).*\.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
